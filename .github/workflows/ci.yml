name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify built CV
        run: |
          test -s dist/CV_GRANDVILLE_Regoboth_BUT3RT_Stage.pdf
          test "$(head -c 5 dist/CV_GRANDVILLE_Regoboth_BUT3RT_Stage.pdf)" = "%PDF-"
          test "$(git hash-object dist/CV_GRANDVILLE_Regoboth_BUT3RT_Stage.pdf)" = "3cf54ac5b938e605bc062122970fe01ce2980637"
