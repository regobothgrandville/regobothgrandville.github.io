name: CI

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Verify built CV
        run: |
          test "$(stat -c%s dist/CV_GRANDVILLE_Regoboth_BUT3RT_Stage.pdf)" -eq 123975
          echo "1999a1d843afac51a0c2ba7ce18f1a72e23845d2eabd046de89e2162bc0133ae  dist/CV_GRANDVILLE_Regoboth_BUT3RT_Stage.pdf" | sha256sum -c -
