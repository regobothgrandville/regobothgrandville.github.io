name: Generate lockfile

on:
  push:
    branches: [develop]
    paths:
      - '.github/workflows/generate-lock.yml'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          ref: develop

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Pin runtime dependencies
        run: npm install --save-exact react react-dom

      - name: Pin development dependencies
        run: npm install --save-dev --save-exact @vitejs/plugin-react vite typescript @eslint/js @types/react @types/react-dom eslint eslint-plugin-react-hooks eslint-plugin-react-refresh globals typescript-eslint

      - name: Verify quality
        run: |
          npm run lint
          npm run build

      - name: Commit reproducible dependency state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: pin dependencies and add lockfile"
          git push origin HEAD:develop
