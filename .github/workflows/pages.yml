name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Verify built CV
        run: |
          test -s dist/CV_GRANDVILLE_Regoboth_BUT3RT_Stage.pdf
          test "$(head -c 5 dist/CV_GRANDVILLE_Regoboth_BUT3RT_Stage.pdf)" = "%PDF-"
          test "$(git hash-object dist/CV_GRANDVILLE_Regoboth_BUT3RT_Stage.pdf)" = "3cf54ac5b938e605bc062122970fe01ce2980637"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
